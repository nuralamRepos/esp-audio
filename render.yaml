services:
  - type: web
    name: esp-telephone-bridge
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_KEY
        sync: false
      - key: LIVEKIT_SECRET
        sync: false
      - key: AUTH_TOKEN
        value: nuralam9922
      - key: MAX_CALL_DURATION_SEC
        value: "1800"
      - key: RING_TIMEOUT_SEC
        value: "45"
